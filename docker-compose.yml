# Единый локальный стенд монорепозитория kcr-originals-tracker:
#   db       — PostgreSQL (данные в именованном volume kcr-backend_pgdata)
#   app      — kcr-backend (Spring Boot, :8080)
#   ml       — kcr-ml, ИИ-помощник (порт наружу не публикуется: доступен только app)
#   frontend — kcr-frontend, nginx: статика SPA + обратный прокси
#              (/api/v1 → app: бэкенд сам проксирует ИИ-запросы в ml) — один origin, без CORS
#   ollama   — (профиль local) локальный Qwen для прод-режима LLM
#   edge     — frontend ↔ app
#   core    — app ↔ db, ml, ollama (nginx до ml и БД не достаёт)
# Значения — из .env рядом с этим файлом (шаблон — .env.example).

name: kcr

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kcr
      POSTGRES_USER: kcr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # 5433 на хосте — не пересекается с dev-контейнером postgres (5432);
      # само приложение ходит в БД по внутренней сети (db:5432)
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcr -d kcr"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - core

  app:
    build: ./server/kcr-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/kcr
      DB_USERNAME: kcr
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Первый ADMIN создаётся при старте, только если таблица пользователей пуста
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Через запятую; нужен только при прямом обращении браузера к :8080 —
      # через frontend-прокси запросы идут с одного origin и CORS не участвует
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Внутренний адрес kcr-ml и сервисный токен для вызовов в него (тот же значение,
      # что AUTH_INTERNAL_TOKEN у ml)
      ML_BASE_URL: ${ML_BASE_URL:-http://ml:8000}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
      - core

  ml:
    build: ./ml
    depends_on:
      - app
    environment:
      # Внутри сети compose бэкенд доступен по имени сервиса app
      KCR_BACKEND_BASE_URL: ${KCR_BACKEND_BASE_URL:-http://app:8080}
      # Сервисный токен: ml отвечает только бэкенду (тот же значение, что ML_INTERNAL_TOKEN у app)
      AUTH_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER:-api}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL}
    networks:
      - core

  frontend:
    build: ./client/kcr-frontend
    depends_on:
      - app
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - edge

  # Локальный Qwen: docker compose --profile local up -d ollama,
  # затем в .env: LLM_PROVIDER=local, LLM_BASE_URL=http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - core

networks:
  # edge — только frontend и app; core — внутренние сервисы (ml и db не доступны nginx напрямую)
  edge:
  core:

volumes:
  # Имя совпадает с volume прежнего стенда server/kcr-backend (name: kcr-backend):
  # данные БД переезжают без миграций
  pgdata:
    name: kcr-backend_pgdata
  ollama:
