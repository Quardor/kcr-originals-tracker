# Автономный стенд: собственный PostgreSQL + kcr-backend.
# Значения подставляются из .env рядом с этим файлом (шаблон — .env.example).

name: kcr-backend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kcr
      POSTGRES_USER: kcr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # 5433 на хосте — не пересекается с dev-контейнером postgres (5432);
      # само приложение ходит в БД по внутренней сети (db:5432)
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcr -d kcr"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/kcr
      DB_USERNAME: kcr
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Первый ADMIN создаётся при старте, только если таблица пользователей пуста
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Через запятую, например: http://localhost:5173,http://localhost:3000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
