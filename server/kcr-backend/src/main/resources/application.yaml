spring:
  application:
    name: kcr-backend

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  access-expiration: 900000
  refresh-expiration: 604800000
