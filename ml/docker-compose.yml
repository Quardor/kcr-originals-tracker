# Local stand (ARCHITECTURE.md §12): kcr-ml + optional local Qwen (profile "local").
# kcr-backend is expected at KCR_BACKEND_BASE_URL (default: host docker.internal:8080).

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      KCR_BACKEND_BASE_URL: ${KCR_BACKEND_BASE_URL:-http://host.docker.internal:8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}

  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
