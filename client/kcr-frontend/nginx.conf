# Единый origin для SPA: статика + прокси на бэкенд и AI-сервис.
# /api/v1/ai/** длиннее /api/v1/** — nginx выбирает наиболее специфичный префикс.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все не-файловые пути отдаёт index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # kcr-ml: REST + WebSocket-чат (/api/v1/ai/chat?token=…)
    location /api/v1/ai/ {
        proxy_pass http://ml:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # kcr-backend: REST API
    location /api/v1/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
