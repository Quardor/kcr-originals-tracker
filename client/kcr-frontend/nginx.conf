# Единый origin для SPA: статика + прокси только на kcr-backend;
# ИИ-запросы (REST и WebSocket-чат) бэкенд сам релеит в kcr-ml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все не-файловые пути отдаёт index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # kcr-backend: WebSocket-чат ИИ (бэкенд делает relay в kcr-ml); долгий простой — норма
    location = /api/v1/ai/chat {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # kcr-backend: REST API, включая /api/v1/ai/** (бэкенд проксирует в kcr-ml)
    location /api/v1/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
